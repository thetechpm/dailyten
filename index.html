function formatDateLabel(dstr) {
  const [y, m, d] = dstr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const thisYear = new Date().getFullYear();
  return dt.toLocaleDateString(undefined, {
    weekday: "short", month: "short", day: "numeric",
    year: y !== thisYear ? "numeric" : undefined,
  });
}


const REPO_NAME = "dailyten-data";
const GH_API = "https://api.github.com";

function b64encode(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function b64decode(b64) {
  return decodeURIComponent(escape(atob(b64)));
}

async function ghFetch(path, token, options) {
  options = options || {};
  return fetch(GH_API + path, {
    ...options,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(options.headers || {}),
    },
  });
}

async function ghGetFile(username, token, filename) {
  const res = await ghFetch(`/repos/${username}/${REPO_NAME}/contents/${filename}`, token);
  if (res.status === 404) return { data: null, sha: null };
  if (!res.ok) throw new Error(`Couldn't read ${filename} (${res.status})`);
  const json = await res.json();
  return { data: JSON.parse(b64decode(json.content)), sha: json.sha };
}

async function ghPutFile(username, token, filename, data, sha, message) {
  const body = {
    message: message || `Update ${filename}`,
    content: b64encode(JSON.stringify(data, null, 2)),
  };
  if (sha) body.sha = sha;
  const res = await ghFetch(`/repos/${username}/${REPO_NAME}/contents/${filename}`, token, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `Couldn't save ${filename} (${res.status})`);
  }
  const json = await res.json();
  return json.content.sha;
}

async function ghListYearFiles(username, token) {
  const res = await ghFetch(`/repos/${username}/${REPO_NAME}/contents/`, token);
  if (!res.ok) return [];
  const items = await res.json();
  if (!Array.isArray(items)) return [];
  return items.filter((i) => /^\d{4}\.json$/.test(i.name)).map((i) => i.name.replace(".json", ""));
}

async function ghValidate(token) {
  const userRes = await fetch(GH_API + "/user", {
    headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" },
  });
  if (!userRes.ok) throw new Error("Sign-in didn't produce a usable token.");
  const user = await userRes.json();
  const repoRes = await ghFetch(`/repos/${user.login}/${REPO_NAME}`, token);
  if (!repoRes.ok) {
    throw new Error(`Couldn't find a private repo named "${REPO_NAME}" on your account, or the app wasn't installed on it.`);
  }
  return user.login;
}

function base64url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function randomToken(len) {
  const arr = new Uint8Array(len || 32);
  crypto.getRandomValues(arr);
  return base64url(arr.buffer);
}
async function pkceChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return base64url(digest);
}

function startGithubLogin() {
  const verifier = randomToken(64);
  const state = randomToken(16);
  sessionStorage.setItem("dailyten_pkce_verifier", verifier);
  sessionStorage.setItem("dailyten_oauth_state", state);
  pkceChallenge(verifier).then((challenge) => {
    const params = new URLSearchParams({
      client_id: GITHUB_CLIENT_ID,
      redirect_uri: REDIRECT_URI,
      state,
      code_challenge: challenge,
      code_challenge_method: "S256",
    });
    window.location.href = `https://github.com/login/oauth/authorize?${params.toString()}`;
  });
}

async function completeGithubLogin(code, state) {
  const savedState = sessionStorage.getItem("dailyten_oauth_state");
  const verifier = sessionStorage.getItem("dailyten_pkce_verifier");
  sessionStorage.removeItem("dailyten_oauth_state");
  sessionStorage.removeItem("dailyten_pkce_verifier");
  if (!verifier || state !== savedState) {
    throw new Error("Sign-in didn't verify correctly. Try again.");
  }
  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code, code_verifier: verifier, redirect_uri: REDIRECT_URI }),
  });
  const data = await res.json();
  if (!res.ok || data.error || !data.access_token) {
    throw new Error(data.error_description || data.error || "Sign-in failed.");
  }
  const login = await ghValidate(data.access_token);
  localStorage.setItem("dailyten_token", data.access_token);
  localStorage.setItem("dailyten_user", login);
  return { token: data.access_token, login };
}

function ConnectScreen({ onConnect }) {

  const [error, setError] = useState(null);

    const state = params.get("state");
    if (!code) return;
    window.history.replaceState({}, "", window.location.pathname);
    setBusy(true);
    completeGithubLogin(code, state)
      .then(({ token, login }) => onConnect(token, login))
      .catch((e) => setError(e.message))
      .finally(() => setBusy(false));
  }, []);

  return (

      <div className="flex items-baseline gap-2 mb-2">
        <Gamepad2 size={22} style={{ color: COLORS.green }} />
        <h1 className="tf-display text-2xl font-semibold">Daily Ten</h1>
      </div>
      <p className="text-sm mb-6" style={{ color: COLORS.textMuted }}>
        Sign in with GitHub to sync with your private <code>dailyten-data</code> repo.
      </p>
      <div className="p-4 rounded-2xl" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
        {error && <p className="text-xs mb-3" style={{ color: COLORS.red }}>{error}</p>}
        <button
          onClick={startGithubLogin}
          disabled={busy}
          className="ctrl-btn w-full py-2.5 rounded-full text-sm font-medium disabled:opacity-40"
          style={{ background: COLORS.green, color: COLORS.onGreen }}
        >
          {busy ? "Signing in\u2026" : "Sign in with GitHub"}
        </button>
      </div>
    </div>
  );
}
function fieldStyle() {
  return {
    border: `1px solid ${COLORS.panelBorder}`,
    borderRadius: 10,
    padding: "8px 10px",
    fontSize: 13,
    color: COLORS.textLight,
    background: COLORS.field,
    width: "100%",
  };
}

function ControllerStripe({ height = 4 }) {
  return (
    <div className="flex gap-1" style={{ height }}>
      <div style={{ flex: 1, background: COLORS.green, borderRadius: 2 }} />
      <div style={{ flex: 1, background: COLORS.red, borderRadius: 2 }} />
      <div style={{ flex: 1, background: COLORS.blue, borderRadius: 2 }} />
      <div style={{ flex: 1, background: COLORS.yellow, borderRadius: 2 }} />
    </div>
  );
}

function TagSelect({ label, value, other, onValue, onOther, options }) {
  return (
    <div className="flex flex-col gap-1">
      <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.textMuted }}>{label}</label>
      <select value={value} onChange={(e) => onValue(e.target.value)} style={fieldStyle()}>
        <option value="">—</option>
        {options.map((o) => <option key={o} value={o}>{o}</option>)}
        <option value="__other__">Other…</option>
      </select>
      {value === "__other__" && (
        <input value={other} onChange={(e) => onOther(e.target.value)} placeholder="type your own" style={fieldStyle()} />
      )}
    </div>
  );
}

function Pill({ children, tone }) {
  const border = tone === "form" ? COLORS.blue : tone === "theme" ? COLORS.green : COLORS.yellow;
  return (
    <span
      className="text-xs px-2 py-0.5 rounded-full"
      style={{ border: `1px solid ${border}`, color: COLORS.textLight, background: "rgba(255,255,255,0.04)" }}
    >
      {children}
    </span>
  );
}

function EditRow({ idea, vocab, onSave, onCancel, onDelete }) {
  const [text, setText] = useState(idea.text);
  const [form, setForm] = useState(vocab.forms.includes(idea.form) || !idea.form ? idea.form : "__other__");
  const [formOther, setFormOther] = useState(vocab.forms.includes(idea.form) ? "" : idea.form);
  const [theme, setTheme] = useState(vocab.themes.includes(idea.theme) || !idea.theme ? idea.theme : "__other__");
  const [themeOther, setThemeOther] = useState(vocab.themes.includes(idea.theme) ? "" : idea.theme);
  const [players, setPlayers] = useState(vocab.players.includes(idea.players) || !idea.players ? idea.players : "__other__");
  const [playersOther, setPlayersOther] = useState(vocab.players.includes(idea.players) ? "" : idea.players);

  return (
    <div className="p-3 rounded-xl" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
      <textarea
        value={text}
        onChange={(e) => setText(e.target.value)}
        rows={2}
        style={{ ...fieldStyle(), resize: "vertical" }}
      />
      <div className="flex flex-wrap gap-2 mt-2">
        <div style={{ minWidth: 120 }}><TagSelect label="Form" value={form} other={formOther} onValue={setForm} onOther={setFormOther} options={vocab.forms} /></div>
        <div style={{ minWidth: 120 }}><TagSelect label="Theme" value={theme} other={themeOther} onValue={setTheme} onOther={setThemeOther} options={vocab.themes} /></div>
        <div style={{ minWidth: 120 }}><TagSelect label="Players" value={players} other={playersOther} onValue={setPlayers} onOther={setPlayersOther} options={vocab.players} /></div>
      </div>
      <div className="flex items-center justify-between mt-3">
        <button
          onClick={() => onDelete(idea)}
          className="text-xs flex items-center gap-1 px-2 py-1 rounded"
          style={{ color: COLORS.red }}
        >
          <Trash2 size={13} /> Delete
        </button>
        <div className="flex gap-2">
          <button onClick={onCancel} className="text-xs px-3 py-1.5 rounded-full" style={{ border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textLight }}>Cancel</button>
          <button
            onClick={() => {
              if (!text.trim()) return;
              onSave({
                text: text.trim(),
                form: resolveValue(form, formOther),
                theme: resolveValue(theme, themeOther),
                players: resolveValue(players, playersOther),
              });
            }}
            className="text-xs px-3 py-1.5 rounded-full font-medium"
            style={{ background: COLORS.green, color: COLORS.onGreen }}
          >
            Save
          </button>
        </div>
      </div>
    </div>
  );
}

function IdeaRow({ idea, editing, vocab, onEdit, onCancelEdit, onSave, onDelete, compileMode, selected, onToggleSelect }) {
  if (editing) {
    return <EditRow idea={idea} vocab={vocab} onSave={onSave} onCancel={onCancelEdit} onDelete={onDelete} />;
  }
  return (
    <div className="p-3 rounded-xl flex items-start gap-3" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
      {compileMode ? (
        <button onClick={() => onToggleSelect(idea.id)} className="mt-0.5" aria-label="Select idea">
          <span
            className="flex items-center justify-center"
            style={{
              width: 18, height: 18, borderRadius: 5,
              border: `1.5px solid ${selected ? COLORS.yellow : COLORS.textMuted}`,
              background: selected ? COLORS.yellow : "transparent",
            }}
          >
            {selected && <Check size={12} color={COLORS.onYellow} />}
          </span>
        </button>
      ) : null}
      <div className="flex-1 min-w-0">
        <p className="text-sm" style={{ color: COLORS.textLight }}>{idea.text}</p>
        {(idea.form || idea.theme || idea.players) && (
          <div className="flex flex-wrap gap-1.5 mt-2">
            {idea.form && <Pill tone="form">{idea.form}</Pill>}
            {idea.theme && <Pill tone="theme">{idea.theme}</Pill>}
            {idea.players && <Pill tone="players">{idea.players}</Pill>}
          </div>
        )}
      </div>
      {!compileMode && (
        <div className="flex gap-1 shrink-0">
          <button onClick={() => onEdit(idea.id)} aria-label="Edit" style={{ color: COLORS.textMuted }}><Pencil size={14} /></button>
          <button onClick={() => onDelete(idea)} aria-label="Delete" style={{ color: COLORS.textMuted }}><Trash2 size={14} /></button>
        </div>
      )}
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => localStorage.getItem("dailyten_token") || "");
  const [username, setUsername] = useState(() => localStorage.getItem("dailyten_user") || "");
  const [connected, setConnected] = useState(!!(localStorage.getItem("dailyten_token") && localStorage.getItem("dailyten_user")));

  const [tab, setTab] = useState("today");
  const [ideasByYear, setIdeasByYear] = useState({});
  const [vocab, setVocab] = useState({ forms: FORMS_DEFAULT, themes: THEMES_DEFAULT, players: PLAYERS_DEFAULT });
  const [vocabSha, setVocabSha] = useState(null);
  const [ready, setReady] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [archiveLoaded, setArchiveLoaded] = useState(false);
  const [archiveLoading, setArchiveLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState(null);

  const today = dateStr(new Date());
  const currentYear = yearOf(today);

  const [text, setText] = useState("");
  const [form, setForm] = useState("");
  const [formOther, setFormOther] = useState("");
  const [theme, setTheme] = useState("");
  const [themeOther, setThemeOther] = useState("");
  const [players, setPlayers] = useState("");
  const [playersOther, setPlayersOther] = useState("");
  const [bank, setBank] = useState(false);

  const [query, setQuery] = useState("");
  const [expandedDates, setExpandedDates] = useState({});
  const [compileMode, setCompileMode] = useState(false);
  const [selected, setSelected] = useState({});
  const [copyState, setCopyState] = useState(null);
  const [editingId, setEditingId] = useState(null);

  useEffect(() => {
    if (!connected) return;
    (async () => {
      try {
        const cy = await ghGetFile(username, token, `${currentYear}.json`);
        const vres = await ghGetFile(username, token, "vocab.json");

        const initial = { [currentYear]: cy.data || [] };

        const seedYear = "2026";
        let seedIdeas = seedYear === currentYear ? cy.data : (await ghGetFile(username, token, `${seedYear}.json`)).data;

        if (seedIdeas === null) {
          const dayCounters = {};
          const seeded = IMPORTED.map(([date, txt, f, th], idx) => {
            const n = (dayCounters[date] = (dayCounters[date] || 0) + 1);
            return {
              id: `seed_${idx}`, text: txt,
              capturedAt: `${date}T20:${pad(n)}:00.000Z`,
              creditedDate: date, form: f, theme: th, players: "",
            };
          });
          await ghPutFile(username, token, `${seedYear}.json`, seeded, null, "Import from Notion archive");
          initial[seedYear] = seeded;
        }

        setIdeasByYear(initial);
        if (vres.data) {
          setVocab({
            forms: vres.data.forms?.length ? vres.data.forms : FORMS_DEFAULT,
            themes: vres.data.themes?.length ? vres.data.themes : THEMES_DEFAULT,
            players: vres.data.players?.length ? vres.data.players : PLAYERS_DEFAULT,
          });
        }
        setVocabSha(vres.sha);
        setReady(true);
      } catch (e) {
        setLoadError(e.message);
        setReady(true);
      }
    })();
  }, [connected]);

  const loadArchive = useCallback(async () => {
    if (archiveLoaded) return;
    setArchiveLoading(true);
    try {
      let years = await ghListYearFiles(username, token);
      if (!years.length) years = [currentYear];
      const missing = years.filter((y) => !(y in ideasByYear));
      if (missing.length) {
        const results = await Promise.all(missing.map((y) => ghGetFile(username, token, `${y}.json`)));
        setIdeasByYear((prev) => {
          const next = { ...prev };
          missing.forEach((y, i) => { next[y] = results[i].data || []; });
          return next;
        });
      }
      setArchiveLoaded(true);
    } catch (e) {
      setLoadError(e.message);
    } finally {
      setArchiveLoading(false);
    }
  }, [archiveLoaded, currentYear, ideasByYear, username, token]);

  useEffect(() => { if (tab === "archive") loadArchive(); }, [tab, loadArchive]);

  const allIdeas = useMemo(() => Object.values(ideasByYear).flat(), [ideasByYear]);

  const todayIdeas = useMemo(
    () => allIdeas.filter((i) => i.creditedDate === today).sort((a, b) => a.capturedAt.localeCompare(b.capturedAt)),
    [allIdeas, today]
  );

  async function persistYear(year, updater) {
    setSaving(true); setSaveError(null);
    try {
      const { data: latest, sha } = await ghGetFile(username, token, `${year}.json`);
      const currentList = latest || [];
      const nextList = updater(currentList);
      await ghPutFile(username, token, `${year}.json`, nextList, sha, `Update ${year} ideas`);
      setIdeasByYear((prev) => ({ ...prev, [year]: nextList }));
    } catch (e) {
      setSaveError(e.message);
    } finally {
      setSaving(false);
    }
  }

  async function maybeSaveVocab(kind, rawPicked, value) {
    if (rawPicked !== "__other__" || !value) return;
    if (vocab[kind].includes(value)) return;
    const next = { ...vocab, [kind]: [...vocab[kind], value] };
    setVocab(next);
    try {
      const newSha = await ghPutFile(username, token, "vocab.json", next, vocabSha, "Update tag vocab");
      setVocabSha(newSha);
    } catch (e) {
      setSaveError(e.message);
    }
  }

  async function addIdea() {
    const trimmed = text.trim();
    if (!trimmed) return;
    const creditedDate = bank ? dateStr(tomorrowDate()) : today;
    const year = yearOf(creditedDate);
    const formVal = resolveValue(form, formOther);
    const themeVal = resolveValue(theme, themeOther);
    const playersVal = resolveValue(players, playersOther);

    const idea = {
      id: uid(), text: trimmed, capturedAt: new Date().toISOString(),
      creditedDate, form: formVal, theme: themeVal, players: playersVal,
    };

    await persistYear(year, (list) => [...list, idea]);
    await Promise.all([
      maybeSaveVocab("forms", form, formVal),
      maybeSaveVocab("themes", theme, themeVal),
      maybeSaveVocab("players", players, playersVal),
    ]);

    setText(""); setForm(""); setFormOther(""); setTheme(""); setThemeOther("");
    setPlayers(""); setPlayersOther(""); setBank(false);
  }

  async function deleteIdea(idea) {
    setEditingId(null);
    await persistYear(yearOf(idea.creditedDate), (list) => list.filter((i) => i.id !== idea.id));
  }

  async function saveEdit(idea, patch) {
    setEditingId(null);
    await persistYear(yearOf(idea.creditedDate), (list) => list.map((i) => (i.id === idea.id ? { ...i, ...patch } : i)));
  }

  const grouped = useMemo(() => {
    const q = query.trim().toLowerCase();
    const filtered = q
      ? allIdeas.filter((i) =>
          i.text.toLowerCase().includes(q) ||
          [i.form, i.theme, i.players].join(" ").toLowerCase().includes(q)
        )
      : allIdeas;
    const map = {};
    filtered.forEach((i) => {
      map[i.creditedDate] = map[i.creditedDate] || [];
      map[i.creditedDate].push(i);
    });
    return Object.entries(map).sort((a, b) => b[0].localeCompare(a[0]));
  }, [allIdeas, query]);

  function toggleSelect(id) { setSelected((prev) => ({ ...prev, [id]: !prev[id] })); }
  const selectedCount = Object.values(selected).filter(Boolean).length;

  async function copySelected() {
    const ids = Object.keys(selected).filter((id) => selected[id]);
    const items = allIdeas.filter((i) => ids.includes(i.id)).sort((a, b) => a.creditedDate.localeCompare(b.creditedDate));
    const lines = items.map((i) => {
      const tags = [i.form, i.theme, i.players].filter(Boolean).join(" \u00b7 ");
      return `- ${i.text}${tags ? ` (${tags})` : ""}`;
    });
    const out = `Ideas compiled ${formatDateLabel(today)}\n\n${lines.join("\n")}`;
    try {
      await navigator.clipboard.writeText(out);
      setCopyState("copied");
      setTimeout(() => setCopyState(null), 1800);
    } catch (e) {
      setCopyState(out);
    }
  }

  function disconnect() {
    localStorage.removeItem("dailyten_token");
    localStorage.removeItem("dailyten_user");
    setConnected(false); setToken(""); setUsername(""); setReady(false);
    setIdeasByYear({}); setArchiveLoaded(false);
  }

  const dotsFilled = Math.min(10, todayIdeas.length);
  const extra = Math.max(0, todayIdeas.length - 10);

  const globalStyle = `
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    body { margin: 0; }
    .tf-body { font-family: 'IBM Plex Sans', sans-serif; }
    .tf-display { font-family: 'Fredoka', sans-serif; }
    button, select, input, textarea { font-family: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid ${COLORS.blue}; outline-offset: 2px;
    }
    .ctrl-btn { box-shadow: 0 3px 0 rgba(0,0,0,0.4); transition: transform 0.05s ease, box-shadow 0.05s ease; }
    .ctrl-btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,0.4); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  `;

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh" }}>
      <style>{globalStyle}</style>

      {!connected ? (
        <ConnectScreen onConnect={(t, u) => { setToken(t); setUsername(u); setConnected(true); }} />
      ) : (
        <div className="max-w-2xl mx-auto px-4 pt-8 pb-24 tf-body" style={{ color: COLORS.textLight }}>
          <header className="mb-6">
            <div className="flex items-baseline gap-2">
              <Gamepad2 size={20} style={{ color: COLORS.green }} />
              <h1 className="tf-display text-2xl font-semibold">Daily Ten \ud83c\udfae</h1>
            </div>
            <p className="text-sm mt-1 mb-3" style={{ color: COLORS.textMuted }}>Ten a day, banked when you need it.</p>
            <ControllerStripe />
          </header>

          {(loadError || saveError) && (
            <div className="mb-4 p-3 rounded-xl text-xs" style={{ background: "rgba(239,68,68,0.12)", border: `1px solid ${COLORS.red}`, color: COLORS.textLight }}>
              {loadError || saveError}
              <button onClick={disconnect} className="ml-2 underline" style={{ color: COLORS.red }}>Reconnect</button>
            </div>
          )}

          <div className="flex gap-2 mb-6">
            <button onClick={() => setTab("today")} className="px-4 py-2 rounded-full text-sm font-medium transition"
              style={{ background: tab === "today" ? COLORS.green : "transparent", color: tab === "today" ? COLORS.onGreen : COLORS.textMuted, border: `1px solid ${tab === "today" ? COLORS.green : COLORS.panelBorder}` }}>
              Today
            </button>
            <button onClick={() => setTab("archive")} className="px-4 py-2 rounded-full text-sm font-medium transition"
              style={{ background: tab === "archive" ? COLORS.blue : "transparent", color: tab === "archive" ? COLORS.onBlue : COLORS.textMuted, border: `1px solid ${tab === "archive" ? COLORS.blue : COLORS.panelBorder}` }}>
              Archive
            </button>
          </div>

          {!ready ? (
            <p className="text-sm" style={{ color: COLORS.textMuted }}>Loading\u2026</p>
          ) : tab === "today" ? (
            <div>
              <div className="p-4 rounded-2xl" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
                <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="What if..." rows={2} style={fieldStyle()} />
                <div className="flex flex-wrap gap-2 mt-3">
                  <div style={{ minWidth: 120 }}><TagSelect label="Form" value={form} other={formOther} onValue={setForm} onOther={setFormOther} options={vocab.forms} /></div>
                  <div style={{ minWidth: 120 }}><TagSelect label="Theme" value={theme} other={themeOther} onValue={setTheme} onOther={setThemeOther} options={vocab.themes} /></div>
                  <div style={{ minWidth: 120 }}><TagSelect label="Players" value={players} other={playersOther} onValue={setPlayers} onOther={setPlayersOther} options={vocab.players} /></div>
                </div>
                <div className="flex items-center justify-between mt-3">
                  <button onClick={() => setBank((b) => !b)} className="flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-full"
                    style={{ border: `1px solid ${bank ? COLORS.blue : COLORS.panelBorder}`, color: bank ? COLORS.blue : COLORS.textMuted, background: bank ? "rgba(59,130,246,0.15)" : "transparent" }}>
                    <Moon size={12} /> {bank ? "Banked for tomorrow" : "Bank for tomorrow"}
                  </button>
                  <button onClick={addIdea} disabled={!text.trim()} className="ctrl-btn flex items-center justify-center rounded-full disabled:opacity-40"
                    style={{ width: 42, height: 42, background: COLORS.green, color: COLORS.onGreen }} aria-label="Add idea">
                    <Plus size={20} />
                  </button>
                </div>
              </div>

              <div className="mt-5 mb-4">
                <div className="flex items-baseline justify-between">
                  <span className="text-sm font-medium">Today's tally</span>
                  <span className="text-sm" style={{ color: COLORS.textMuted }}>{todayIdeas.length} of 10{saving ? " \u00b7 saving\u2026" : ""}</span>
                </div>
                <div className="flex gap-1.5 mt-2">
                  {Array.from({ length: 10 }).map((_, i) => (
                    <span key={i} style={{ width: 14, height: 14, borderRadius: "50%", backgroundColor: i < dotsFilled ? COLORS.yellow : "transparent", border: `1.5px solid ${i < dotsFilled ? COLORS.yellow : COLORS.textMuted}` }} />
                  ))}
                  {extra > 0 && <span className="text-xs ml-1" style={{ color: COLORS.blue }}>+{extra}</span>}
                </div>
              </div>

              <div className="flex flex-col gap-2">
                {todayIdeas.length === 0 && <p className="text-sm" style={{ color: COLORS.textMuted }}>Nothing logged yet. What's rattling around?</p>}
                {todayIdeas.map((idea) => (
                  <IdeaRow key={idea.id} idea={idea} vocab={vocab} editing={editingId === idea.id}
                    onEdit={setEditingId} onCancelEdit={() => setEditingId(null)}
                    onSave={(patch) => saveEdit(idea, patch)} onDelete={deleteIdea} compileMode={false} />
                ))}
              </div>
            </div>
          ) : (
            <div>
              <div className="flex gap-2 mb-4">
                <div className="flex-1 flex items-center gap-2 px-3 py-2 rounded-full" style={{ border: `1px solid ${COLORS.panelBorder}`, background: COLORS.panel }}>
                  <Search size={14} style={{ color: COLORS.textMuted }} />
                  <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search text or tags" className="text-sm w-full bg-transparent" style={{ color: COLORS.textLight, outline: "none" }} />
                  {query && <button onClick={() => setQuery("")}><XIcon size={14} style={{ color: COLORS.textMuted }} /></button>}
                </div>
                <button onClick={() => { setCompileMode((c) => !c); setSelected({}); setCopyState(null); }} className="px-3 py-2 rounded-full text-sm flex items-center gap-1.5"
                  style={{ border: `1px solid ${compileMode ? COLORS.yellow : COLORS.panelBorder}`, color: compileMode ? COLORS.yellow : COLORS.textMuted }}>
                  <Copy size={14} /> Compile
                </button>
              </div>

              {archiveLoading && <p className="text-sm mb-3" style={{ color: COLORS.textMuted }}>Gathering past days\u2026</p>}
              {grouped.length === 0 && !archiveLoading && <p className="text-sm" style={{ color: COLORS.textMuted }}>Nothing here yet.</p>}

              <div className="flex flex-col gap-2">
                {grouped.map(([date, ideas]) => {
                  const isOpen = expandedDates[date] ?? (query.trim().length > 0);
                  return (
                    <div key={date} className="rounded-xl overflow-hidden" style={{ border: `1px solid ${COLORS.panelBorder}` }}>
                      <button onClick={() => setExpandedDates((p) => ({ ...p, [date]: !isOpen }))} className="w-full flex items-center justify-between px-3 py-2.5" style={{ background: COLORS.panel }}>
                        <span className="text-sm font-medium">{formatDateLabel(date)}</span>
                        <span className="flex items-center gap-2">
                          <span className="text-xs" style={{ color: COLORS.textMuted }}>{ideas.length}</span>
                          {isOpen ? <ChevronDown size={14} style={{ color: COLORS.textMuted }} /> : <ChevronRight size={14} style={{ color: COLORS.textMuted }} />}
                        </span>
                      </button>
                      {isOpen && (
                        <div className="flex flex-col gap-2 p-2" style={{ background: COLORS.bg }}>
                          {ideas.map((idea) => (
                            <IdeaRow key={idea.id} idea={idea} vocab={vocab} editing={editingId === idea.id}
                              onEdit={setEditingId} onCancelEdit={() => setEditingId(null)}
                              onSave={(patch) => saveEdit(idea, patch)} onDelete={deleteIdea}
                              compileMode={compileMode} selected={!!selected[idea.id]} onToggleSelect={toggleSelect} />
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              {compileMode && selectedCount > 0 && (
                <div className="fixed bottom-4 left-4 right-4 max-w-2xl mx-auto p-3 rounded-2xl flex items-center justify-between" style={{ background: COLORS.yellow, color: COLORS.onYellow }}>
                  <span className="text-sm font-medium">{selectedCount} selected</span>
                  <button onClick={copySelected} className="text-sm font-medium flex items-center gap-1.5 px-3 py-1.5 rounded-full" style={{ background: COLORS.bg, color: COLORS.yellow }}>
                    {copyState === "copied" ? <><Check size={14} /> Copied</> : <><Copy size={14} /> Copy</>}
                  </button>
                </div>
              )}

              {copyState && copyState !== "copied" && (
                <div className="mt-4 p-3 rounded-xl" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
                  <p className="text-xs mb-2" style={{ color: COLORS.textMuted }}>Clipboard access was blocked here. Select and copy the text below.</p>
                  <textarea readOnly value={copyState} rows={6} style={fieldStyle()} onFocus={(e) => e.target.select()} />
                </div>
              )}
            </div>
          )}

          <div className="text-xs mt-10 text-center" style={{ color: COLORS.textMuted }}>
            <p>Stored in your private dailyten-data repo on GitHub.</p>
            <button onClick={disconnect} className="underline mt-1" style={{ color: COLORS.textMuted }}>Disconnect</button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);


</script>
</body>
</html>
